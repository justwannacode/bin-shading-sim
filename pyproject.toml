[project]
name = "bidshade"
version = "0.1.0"
description = "Offline first-price auction simulator for bid shading with censored bid landscape models (iPinYou)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "lightgbm>=4.0",
    "matplotlib>=3.8",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.10"]
dev = ["pytest>=8.0", "ruff>=0.5", "lifelines>=0.28", "pre-commit>=3.5"]

[project.scripts]
bidshade = "bidshade.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bidshade"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
ignore = ["E501"]  # line length is handled by `ruff format`

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
